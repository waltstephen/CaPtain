# CaPtain-4B-SFT recipe.
base_model: Qwen/Qwen3.5-4B            # the post-trained release (not -Base)
base_preprocessing: scripts/untie_base.py   # lm_head.weight = copy of embed_tokens, tie_word_embeddings false, mtp.* dropped

common:
  trainer: train/train_sft.py           # HF Trainer + DeepSpeed ZeRO-3 (train/ds_zero3.json), bf16, gradient checkpointing
  optimizer: AdamW (HF Trainer default betas/eps), weight_decay 0.0
  grad_clip: 1.0                        # ds_zero3.json gradient_clipping
  lr_scheduler: cosine to 0 over the scheduled steps
  warmup_steps: 30
  peak_lr: 1.0e-5
  per_device_batch: 1                   # one (packed) row per rank per step
  grad_accum: 1
  freeze_vision: true                   # vision tower frozen; language model (incl. untied lm_head) fully fine-tuned
  mask_text_hints: 0.2                  # text-hint mask probability (see data/FORMAT.md)
  supervision: assistant turns only (meta.turn_index -> last assistant turn; meta.supervise_turns -> listed turns)
  attention: sdpa
  step_order: sequential (SFT_SAMPLING=sequential) over the file order written by train/mix_order.py --world <ranks>

sft:                                    # = CaPtain-4B-SFT
  data: CaPtain-SFT-Data (table in README.md), helper-library code normalisation applied
  world_size: 16                        # 2 nodes x 8 H100-80GB
  epochs: 1.5                           # = 2,435 optimizer steps (1,623 steps / epoch at 16 ranks)
  max_length: 66048                     # rows are packed to <= ~65,536 tokens; 3 rows encode slightly longer
  loss_tokens_per_step: C_w             # constant global per-token normaliser: sup_tokens.py (QA_W=0.5, world 16)
  qa_loss_weight: 0.5                   # per-token weight of visual-QA / general rows; agent rows 1.0
  row_loss_weight: meta.loss_weight     # 2.0 for side-approach / pivot re-plan demonstrations
  save_steps: 200
  final_train_loss: 0.1947
  wall_time: ~7.6 h on 16 x H100-80GB (~6-7 s/step), ~120 H100-hours
