[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "captain-harness"
version = "1.0.0"
description = "CaPtain-Harness: environment servers (LIBERO family, RoboTwin 2.0, RoboDojo, SimplerEnv, CaP-Bench, hardware backend), 22-capability robot API and Codex-style ReAct driver for code-as-policy agents"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21", "numpy>=1.26,<3", "pillow>=10", "scipy>=1.10", "tiktoken==0.12.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
simulator = ["bddl==1.0.1", "robosuite==1.4.0", "mujoco==2.3.7", "torch>=2", "opencv-python-headless>=4.8"]
# harness side of the RoboTwin 2.0 / RoboDojo / SimplerEnv backends (separate venv: requirements-transfer.txt)
transfer = ["mujoco>=3.2", "opencv-python-headless>=4.8", "trimesh>=4", "requests", "websockets"]
# optional sampling-based planner (not used by the CaPtain evaluations)
planning = ["ompl>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.pi_sdk", "*.pi_sdk.*", "*.node_modules", "*.node_modules.*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
